name: Build Android APK

on:
  push:
    branches: [main, 'claude/**']
    paths: ['android-app/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build signed APK
        working-directory: android-app
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: Name the APK
        run: cp android-app/app/build/outputs/apk/release/app-release.apk BahaarOffice.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BahaarOffice-apk
          path: BahaarOffice.apk

      - name: Publish download (main branch only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "app-v1.0.${{ github.run_number }}" BahaarOffice.apk \
            --title "Bahaar Office Android app v1.0.${{ github.run_number }}" \
            --notes "Install on Android: download BahaarOffice.apk on the phone, open it, and allow 'Install unknown apps' if asked. The app opens the live office system, so it always has every feature." \
            --latest
