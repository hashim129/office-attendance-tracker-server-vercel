plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bahaarjourneys.office'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bahaarjourneys.office'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('APP_VERSION_CODE') ?: '1')
        versionName System.getenv('APP_VERSION_NAME') ?: '1.0'
    }

    signingConfigs {
        release {
            // Uses the KEYSTORE_* secrets when set; otherwise the bundled office key in this folder.
            storeFile file(System.getenv('KEYSTORE_FILE') ?: 'bahaar-office.keystore')
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'bahaaroffice'
            keyAlias System.getenv('KEY_ALIAS') ?: 'bahaar'
            keyPassword System.getenv('KEY_PASSWORD') ?: 'bahaaroffice'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    packaging {
        resources { excludes += ['META-INF/*.kotlin_module'] }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Phone push notifications (works when the app is closed). Started at run time with settings from the server,
    // so no google-services.json is built into the app.
    implementation 'com.google.firebase:firebase-messaging:24.1.0'
}
